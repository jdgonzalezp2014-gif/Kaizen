# The Slack reservations reminder on a clock (§99).
# Every hour; Kaizen sends each message once a day at its hour in the team's
# zone (Central by default; Settings → Slack): 8 AM, 3 PM — and the 11:55 PM
# check-out from the run below — so most runs send nothing.
# Needs repository secrets KAIZEN_URL (https://…, no trailing slash) and
# KAIZEN_INGEST_TOKEN (Settings → ingest token), and /api/slack-cron
# bypassed in Cloudflare Access.
name: slack-cron
on:
  schedule:
    - cron: '5 * * * *'
    # The tasks' check-out at 11:55 PM Central (§107): 04:55 UTC in daylight time, 05:55 UTC in standard time.
    # Kaizen sends it once, for the right day, whichever of the two lands at 23:55 local.
    - cron: '55 4,5 * * *'
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call Kaizen
        env:
          KAIZEN_URL: ${{ secrets.KAIZEN_URL }}
          KAIZEN_INGEST_TOKEN: ${{ secrets.KAIZEN_INGEST_TOKEN }}
        run: |
          if [ -z "$KAIZEN_URL" ] || [ -z "$KAIZEN_INGEST_TOKEN" ]; then echo "Secrets not set yet — skipping."; exit 0; fi
          curl -sS --fail-with-body -X POST "$KAIZEN_URL/api/slack-cron" -H "X-Kaizen-Ingest: $KAIZEN_INGEST_TOKEN"
